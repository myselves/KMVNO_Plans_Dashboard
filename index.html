function perMonths(per) {
  const m = String(per).match(/(\d+)개월/);
  return m ? parseInt(m[1]) : null; // null = 상시/평생/정액
}

const SORTS = {};
const NETS = {};
function setNet(catId, val) { NETS[catId] = val; renderTbody(catId); }
function dl(text, name) {
  const blob = new Blob(["\uFEFF" + text], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportCsv(catId) {

  const lines = [head.join(",")];

      .map(x => '"' + String(x).replace(/"/g, '""') + '"').join(","));
  }
  dl(lines.join("\n"), "MVNO_" + catId + ".csv");
}

  const lines = [q(["구분","회사","이벤트명","유형","회당 지급액(원)","지급 횟수","총 지급액(원)","운영 이벤트 수","대표 이벤트","적용 요금제 수"])];

const promoOf = r => !r ? null : (r.promo !== null && r.promo !== undefined) ? r.promo : r.reg; // 가입 직후 월요금
function sortRows(rows, mode) {
  const arr = [...rows];
  if (mode === "promo") {
    // 프로모션 없는 상품은 프로모션가=정가로 간주해 함께 정렬
    arr.sort((a, b) => promoOf(a) - promoOf(b) || a.reg - b.reg);
  } else if (mode === "period") {
    // 상시할인 = 기간 무한 → 최상단, 기간형은 긴 순, 정액·미표기는 하단
    const dur = r => /상시할인/.test(r.per) ? Infinity : (perMonths(r.per) ?? -1);
    arr.sort((a, b) => dur(b) - dur(a) || a.reg - b.reg);
  } else if (mode === "mno") {
    const ord = s => /SKT/.test(s) ? 0 : /KT/.test(s) ? 1 : /LGU/.test(s) ? 2 : 3;
    arr.sort((a, b) => ord(a.mno) - ord(b.mno) || a.reg - b.reg);
  } else {
    arr.sort((a, b) => a.reg - b.reg); // 기본: 정가 낮은 순
  }
  return arr;
}
function rowHtml(r, cat, pin) {
  const diff = pin ? promoOf(r) - promoOf(pin) : null; // 자사 대비 = 프로모션가(가입 직후 월요금) 기준
  const diffCell = r.pin ? '<span class="zero">기준</span>' : diff === null ? '<span class="zero">—</span>' : diff === 0 ? '<span class="zero">동가</span>' : `<span class="${diff < 0 ? "neg" : "pos"}">${diff > 0 ? "+" : ""}${fmt(diff)}</span>`;
  return `<tr class="${r.pin ? "pin" : ""}">
    <td>${r.c}</td>
    <td>${r.n}</td>
    <td>${r.mno}</td><td>${r.net}</td><td>${r.data}</td><td>${r.qos}</td><td>${r.v}</td><td>${r.s}</td>
    <td>${fmt(r.reg)}</td>
    <td>${fmt(promoOf(r))}</td>
    <td>${diffCell}</td>
    <td>${r.per}</td>
    <td>${Math.round(r.reg / cat.gb).toLocaleString()}</td>
    <td>${Math.round(promoOf(r) / cat.gb).toLocaleString()}</td>
  </tr>`;
}
function renderTbody(catId) {
  const cat = CATS[catId];
  const pin = cat.rows.find(r => r.pin);
  let rows = sortRows(cat.rows, SORTS[catId] || "promo");
  const f = NETS[catId];
  if (f) {
    // 통신망 필터 시에도 비교 기준인 핀다이렉트 행은 항상 최상단 고정
    rows = rows.filter(r => r.pin || r.mno.split("\u00b7").includes(f));
    if (pin) rows = [pin, ...rows.filter(r => !r.pin)];
  }
  const el = document.getElementById("tb_" + catId);
  if (el) el.innerHTML = rows.map(r => rowHtml(r, cat, pin)).join("");
}
function setSort(catId, val) { SORTS[catId] = val; renderTbody(catId); }

function buildCatPage(id, cat) {
  const pin = cat.rows.find(r => r.pin);
  const saveOf = r => { const m = perMonths(r.per); return (r.promo != null && m) ? (r.reg - r.promo) * m : 0; };
  let kpis;
  if (!pin) {
    kpis = `<div class="pinmissing">이 카테고리에 <b>핀다이렉트 기준 상품</b>이 없습니다(단종·미게시). 아래 경쟁사 비교표·그래프는 정상 표시됩니다.</div>`;
  } else {
    const minPromoRow = [...cat.rows].sort((a, b) => promoOf(a) - promoOf(b))[0];
    const promoGap = promoOf(pin) - promoOf(minPromoRow);
    const pinMonths = perMonths(pin.per);
    const pinSave = pinMonths ? (pin.reg - promoOf(pin)) * pinMonths : 0;
    const maxSaveRow = [...cat.rows].sort((a, b) => saveOf(b) - saveOf(a))[0];
    const maxSave = saveOf(maxSaveRow);
    const saveGap = pinSave - maxSave; // 0 = 자사가 최대
    kpis = `
    <div class="kpisplit">
      <div class="kpicol">
        <div class="kpicol-h">프로모션가 · 가입 직후 월요금</div>
        <div class="kpitrio">
          <div class="kpi self"><div class="k">자사 프로모션가</div><div class="v">${fmt(promoOf(pin))}원</div><div class="s">${pin.per} · 종료 후 ${fmt(pin.reg)}원</div></div>
          <div class="kpi"><div class="k">카테고리 최저 프로모션가</div><div class="v">${fmt(promoOf(minPromoRow))}원</div><div class="s">${minPromoRow.pin || promoGap === 0 ? "핀다이렉트" : minPromoRow.c}</div></div>
          <div class="kpi"><div class="k">차이</div><div class="v">${promoGap === 0 ? '<span class="rank1">최저 동률</span>' : '<span class="neg">+' + fmt(promoGap) + '원</span>'}</div><div class="s">${promoGap === 0 ? "자사가 카테고리 최저" : "자사가 최저 대비 비쌈"}</div></div>
        </div>
      </div>
      <div class="kpicol">
        <div class="kpicol-h">혜택 총액 · (정가−프로모션가) × 기간</div>
        <div class="kpitrio">
          <div class="kpi self"><div class="k">자사 프로모션 혜택 총액</div><div class="v">${fmt(pinSave)}원</div><div class="s">(정가−프로모션가) × ${pin.per}</div></div>
          <div class="kpi"><div class="k">카테고리 최대 혜택 총액</div><div class="v">${fmt(maxSave)}원</div><div class="s">${maxSaveRow.pin ? "핀다이렉트" : maxSaveRow.c + " · " + maxSaveRow.per}</div></div>
          <div class="kpi"><div class="k">차이</div><div class="v">${saveGap === 0 ? '<span class="rank1">최대 동률</span>' : '<span class="neg">' + fmt(saveGap) + '원</span>'}</div><div class="s">${saveGap === 0 ? "자사가 카테고리 최대" : "자사가 최대 대비 적음"}</div></div>
        </div>
      </div>
    </div>`;
  }

  // promo bars (asc by promo; 상시형은 정가로 표기)
  // 가격대가 10원~수만원으로 넓어 선형 스케일이면 저가군이 전부 미세 stub이 된다 → 로그 스케일로 시각차 확보
  const promoRows = cat.rows.map(r => ({...r, p: r.promo != null ? r.promo : r.reg}))
    .sort((a, b) => a.p - b.p);
  const minP = Math.min(...promoRows.map(r => r.p));
  const maxP = Math.max(...promoRows.map(r => r.p));
  const lgP = x => Math.log(x + 1);
  const promoW = v => maxP === minP ? 100 : (8 + (lgP(v) - lgP(minP)) / (lgP(maxP) - lgP(minP)) * 92);
  const bars = promoRows.map(r => `
    <div class="barrow">
      <div class="barlabel">${r.c}</div>
      <div class="bartrack"><div class="barfill ${r.pin ? "pin" : ""}" style="width:${promoW(r.p).toFixed(1)}%"></div></div>
      <div class="barval">${fmt(r.p)}원 · ${r.per}${r.promo == null ? "" : " → 이후 " + fmt(r.reg) + "원"}</div>
    </div>`).join("");

  // 프로모션 혜택 총액 bars — (정가−프로모션가)×할인기간
  const saveRows = cat.rows.map(r => {
    const m = perMonths(r.per);
    return {...r, save: (r.promo != null && m) ? (r.reg - r.promo) * m : 0, m};
  }).sort((a, b) => b.save - a.save);
  const maxS = Math.max(...saveRows.map(r => r.save), 1);
  const saveBars = saveRows.map(r => `
    <div class="barrow">
      <div class="barlabel">${r.c}</div>
      <div class="bartrack"><div class="barfill ${r.pin ? "pin" : ""}" style="width:${Math.max(1, r.save / maxS * 100)}%"></div></div>
      <div class="barval">${r.save ? fmt(r.save) + "원 (월 " + fmt(r.reg - r.promo) + "원 × " + r.m + "개월)" : "프로모션 혜택 없음 (" + r.per + ")"}</div>
    </div>`).join("");

  return `
    <div class="card"><h2>${cat.title}</h2>
    <div class="cardhead">
      <div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select class="sortsel" onchange="setNet('${id}', this.value)">
          <option value="">통신망 전체</option>
          <option value="SKT">SKT</option>
          <option value="KT">KT</option>
          <option value="LGU+">LGU+</option>
        </select>
        <select class="sortsel" onchange="setSort('${id}', this.value)">
          <option value="promo">프로모션가 낮은 순</option>
          <option value="reg">정가 낮은 순</option>
          <option value="period">할인기간 긴 순</option>
          <option value="mno">통신망별</option>
        </select>
        <button class="btn" onclick="exportCsv('${id}')">CSV 내보내기</button>
      </div>
    </div>
    ${kpis}
    <div class="tblwrap"><table>
      <thead><tr><th>회사</th><th>요금제명</th><th>통신망</th><th>5G/LTE</th><th>데이터</th><th>QoS</th><th>통화</th><th>문자</th><th>정가(원)</th><th>프로모션가(원)</th><th>자사 대비(원)</th><th>할인기간</th><th>원/GB</th><th>프로모 원/GB</th></tr></thead>
      <tbody id="tb_${id}"></tbody></table></div>
    </div>

    <div class="card"><h2>프로모션 비교 대시보드</h2>
      <div class="split">
        <div>
          <div class="bartitle">가입 직후 월요금 <span class="unit">(원/월)</span></div>
          <div class="barsub">막대가 길수록 월요금이 높음 · <span class="tagpin">보라 = 핀다이렉트</span></div>
          <div class="bars">${bars}</div>
        </div>
        <div>
          <div class="bartitle">프로모션 혜택 총액 <span class="unit">(원)</span></div>
          <div class="barsub">(정가 − 프로모션가) × 할인기간 · 막대가 길수록 혜택이 큼</div>
          <div class="bars">${saveBars}</div>
        </div>
      </div>
    </div>

    <div class="card analysis"><h2>가격 경쟁력 분석</h2>${cat.analysis}</div>`;
}

function histSigOf(r) {

}

  const _hist = (typeof HIST !== "undefined" ? HIST : []);
  const _w = histWindow();
  let rounds = _hist.filter(r => { const t = new Date(r.date).getTime(); return t >= _w.lo && t <= _w.hi; });
  // 기준(앵커) 요금제가 바뀌면 그 시점부터 새로 시작 — 창 내 마지막 회차 앵커와 같은 연속 구간만 사용
  let restarted = false, restartFrom = null;
  if (applyRestart && HIST_SIG_PAGES.includes(histState.page) && rounds.length) {
    const latest = histSigOf(rounds[rounds.length - 1]);
    if (latest != null) {
      let start = rounds.length - 1;
      while (start > 0 && histSigOf(rounds[start - 1]) === latest) start--;
      if (start > 0) { restarted = true; restartFrom = rounds[start].date; }
      rounds = rounds.slice(start);
    }
  }
  const dates = rounds.map(r => r.date);
  const getMap = r => histState.page === "moyo" ? ((r.moyo && r.moyo[histState.sub]) || {}) : (r[histState.page] || {});
  const companies = [];
  rounds.forEach(r => Object.keys(getMap(r)).forEach(c => { if (!companies.includes(c)) companies.push(c); }));
  const series = {};
  companies.forEach(c => series[c] = rounds.map(r => { const m = getMap(r); return (c in m) ? m[c] : null; }));
  const ordered = companies.filter(isPin).concat(companies.filter(c => !isPin(c)));
  return { dates, series, companies: ordered, restarted, restartFrom };
}

function histChartSvg() {
  const { dates, series, companies } = histSeries();
  if (!companies.length) return `<div class="histempty">표시할 데이터가 없습니다.</div>`;
  const W = 960, H = 360, m = { t:18, r:154, b:46, l:78 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  // 핀다이렉트·선택 라인 값은 절대 잘리지 않게 범위에 포함시킨다
  const sorted = vals.slice().sort((a,b) => a-b);

  let lo = qi(0.03), hi = qi(0.97);

    if (!arr) return;

  });
  if (!isFinite(lo)) { lo = 0; hi = 1; }

  function niceStep(range, target) {

  const X = i => m.l + (n === 1 ? iw/2 : iw * i/(n-1));

  const Y = v => { const y = m.t + ih * (1 - (v - ymin)/(ymax - ymin)); return Math.max(m.t, Math.min(m.t+ih, y)); };

  for (let val = ymin; val <= ymax + step*0.001; val += step) { const y = m.t + ih * (1 - (val - ymin)/(ymax - ymin));
    grid += `<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${m.l+iw}" y2="${y.toFixed(1)}" class="histgrid"/>`;
    grid += `<text x="${m.l-8}" y="${(y+3).toFixed(1)}" class="histaxis" text-anchor="end">${fmt(Math.round(val))}</text>`;
  }
  // 가로축 라벨: 회차가 많으면 겹치지 않게 솎아 최대 8~9개만(마지막 회차는 항상 표시)

  // 다년 누적 시 MM-DD만으로는 연도 구분이 안 되므로, 표시 구간이 400일을 넘으면 YY-MM-DD로

  const rangeInner = `<input type="date" id="histFrom" class="histdate" min="${dmin}" max="${dmax}" value="${fromV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<span class="histtil">~</span>`
    + `<input type="date" id="histTo" class="histdate" min="${dmin}" max="${dmax}" value="${toV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<button class="histbtn${rangeOn?' on':''}" onclick="setHistRange()">적용</button>`;
  const oneRound = total <= 1
    ? `<div class="histnote">아직 <b>${total}회차</b>뿐이라 기준점만 표시됩니다. 업데이트가 쌓이면 회사별 추이선이 그려집니다.</div>` : "";
  const meta = histSeries();
  const restartNote = meta.restarted
    ? `<div class="histnote" style="color:var(--amber);font-weight:700;">⟲ 기준 요금제가 <b>${meta.restartFrom}</b> 회차에 변경되어, 그 시점부터 새로 표시합니다(이전 기준의 추이는 스펙이 달라 이어 붙이지 않습니다).</div>` : "";
  root.innerHTML = `<div class="card">
    <h2>가격 히스토리</h2>
    <div class="histctrls">
      <div class="histgrp">${pbtns}</div>
      ${subctrl}
      <div class="histgrp">${nbtns}<span class="histvsep"></span><span class="histtil" style="margin:0 6px 0 0;font-weight:700">기간 선택</span>${rangeInner}</div>
    </div>
    <div class="histnote">회사별 <b>${pInfo.metric}(원)</b> 추이 · 선이나 회사 버튼을 누르면 상세 데이터가 열립니다.</div>
    ${oneRound}
    ${restartNote}
    ${histChartSvg()}
    ${histLegend()}
    ${histDetail()}
  </div>`;
}

tabDefs.forEach((t, i) => {
  const tab = document.createElement("div");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.textContent = t.label;
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("pg_" + t.id).classList.add("active");
  };
  tabsEl.appendChild(tab);
  const pg = document.createElement("div");
  pg.className = "page" + (i === 0 ? " active" : "");
  pg.id = "pg_" + t.id;
  pg.innerHTML = t.id === "summary" ? buildSummaryPage() : t.id === "history" ? buildHistoryPage() : t.id === "cheapest" ? buildCheapPage() : t.id === "moyo" ? buildMoyoPage() : t.id === "gifts" ? buildGiftsPage() : buildCatPage(t.id, CATS[t.id]);
  pages.appendChild(pg);
});
Object.keys(CATS).forEach(renderTbody);
renderHistory();
</script>
</body>
</html>
