<style>

  :root { --bg:#F2F6FC; --card:#FFFFFF; --card2:#FBFCFF; --navy:#1E2563; --navy-soft:#3A4180;
    --txt:#2A2F45; --sub:#6B7390; --line:#C9D6EF; --line2:#E2EAF8;
    --accent-blue:#4C7DD4; --accent-sky:#A9C4EC; --accent-pink:#E068B4; --violet:#6A4FC9; --sel:#D63C93;
    --red:#D64550; --blue:#2563CD; --green:#178A50; --amber:#B7791F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--bg); }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(76,125,212,0.12), transparent 60%),
      radial-gradient(900px 460px at 90% -14%, rgba(224,104,180,0.09), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt); padding:44px 32px 80px; font-size:14px;
    max-width:1440px; margin:0 auto; }
  /* 히어로 */
  .hero { margin-bottom:26px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:3px; color:var(--accent-blue); margin-bottom:10px; }
  .eyebrow::before { content:"● "; font-size:8px; vertical-align:2px; }
  h1 { font-size:28px; letter-spacing:-0.5px; font-weight:800; margin-bottom:14px;
    background:linear-gradient(90deg, var(--navy) 55%, var(--accent-blue)); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; color:var(--navy); }
  .meta { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:12px; color:var(--sub); background:var(--card);
    border:1px solid var(--line2); border-radius:999px; padding:5px 12px;
    box-shadow:0 2px 6px rgba(30,37,99,0.05); }
  .chip b { color:var(--navy); font-weight:700; }
  /* 탭 — 세그먼트 바 */
  .tabs { display:inline-flex; gap:2px; flex-wrap:wrap; margin-bottom:24px;
    background:var(--card); border:1px solid var(--line2);
    border-radius:14px; padding:5px; box-shadow:0 4px 14px rgba(30,37,99,0.07); }
  .tab { padding:8px 15px; border-radius:10px; border:1px solid transparent; background:transparent;
    cursor:pointer; font-size:13.5px; font-weight:600; color:var(--sub); transition:all .16s; }
  .tab:hover { color:var(--navy); background:#F0F4FC; }
  .tab.active { background:linear-gradient(135deg, var(--accent-blue), var(--accent-pink)); color:#fff;
    box-shadow:0 4px 14px rgba(76,125,212,0.35); }
  .page { display:none; } .page.active { display:block; }
  /* 카드 */
  .card { background:linear-gradient(180deg, var(--card), var(--card2)); border:1px solid var(--line2);
    border-radius:18px; padding:24px 26px; margin-bottom:20px;
    box-shadow:0 12px 32px rgba(30,37,99,0.08); }
  .card h2 { font-size:17px; margin-bottom:5px; color:var(--navy); letter-spacing:-0.2px;
    display:flex; align-items:center; gap:9px; }
  .card h2::before { content:""; width:8px; height:8px; border-radius:3px; flex:none;
    background:linear-gradient(135deg, var(--accent-sky), var(--accent-blue));
    box-shadow:0 0 8px rgba(76,125,212,0.5); }
  .card .desc { font-size:12.5px; color:var(--sub); margin-bottom:14px; }
  .tblwrap { overflow-x:auto; border:1px solid var(--line2); border-radius:12px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; }
  th { background:#EAF0FA; color:var(--navy); padding:10px 12px; border-bottom:1px solid var(--line);
    text-align:left; font-weight:700; font-size:11px; letter-spacing:0.6px; }
  td { padding:9px 12px; border-bottom:1px solid var(--line2); text-align:left; color:var(--txt); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#F7FAFF; }
  tr.pin td { background:linear-gradient(90deg, #F1EDFD, #F8F6FF); font-weight:700; }
  tr.pin td:first-child { border-left:3px solid var(--violet); }
  tr.pin:hover td { background:linear-gradient(90deg, #F1EDFD, #F8F6FF); }
  .neg { color:var(--red); font-weight:700; } .pos { color:var(--green); font-weight:700; }
  .zero { color:var(--navy); font-weight:800; }
  /* 배지 */
  .badge { display:inline-block; font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; margin-right:8px; }

function perMonths(per) {
  const m = String(per).match(/(\d+)개월/);
  return m ? parseInt(m[1]) : null; // null = 상시/평생/정액
}

const SORTS = {};
const NETS = {};
function setNet(catId, val) { NETS[catId] = val; renderTbody(catId); }
function dl(text, name) {
  const blob = new Blob(["\uFEFF" + text], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportCsv(catId) {

  const lines = [head.join(",")];

      .map(x => '"' + String(x).replace(/"/g, '""') + '"').join(","));
  }
  dl(lines.join("\n"), "MVNO_" + catId + ".csv");
}

  const lines = [q(["구분","회사","이벤트명","유형","회당 지급액(원)","지급 횟수","총 지급액(원)","운영 이벤트 수","대표 이벤트","적용 요금제 수"])];

const promoOf = r => !r ? null : (r.promo !== null && r.promo !== undefined) ? r.promo : r.reg; // 가입 직후 월요금
function sortRows(rows, mode) {
  const arr = [...rows];
  if (mode === "promo") {
    // 프로모션 없는 상품은 프로모션가=정가로 간주해 함께 정렬
    arr.sort((a, b) => promoOf(a) - promoOf(b) || a.reg - b.reg);
  } else if (mode === "period") {
    // 상시할인 = 기간 무한 → 최상단, 기간형은 긴 순, 정액·미표기는 하단
    const dur = r => /상시할인/.test(r.per) ? Infinity : (perMonths(r.per) ?? -1);
    arr.sort((a, b) => dur(b) - dur(a) || a.reg - b.reg);
  } else if (mode === "mno") {
    const ord = s => /SKT/.test(s) ? 0 : /KT/.test(s) ? 1 : /LGU/.test(s) ? 2 : 3;
    arr.sort((a, b) => ord(a.mno) - ord(b.mno) || a.reg - b.reg);
  } else {
    arr.sort((a, b) => a.reg - b.reg); // 기본: 정가 낮은 순
  }
  return arr;
}
function rowHtml(r, cat, pin) {
  const diff = pin ? promoOf(r) - promoOf(pin) : null; // 자사 대비 = 프로모션가(가입 직후 월요금) 기준
  const diffCell = r.pin ? '<span class="zero">기준</span>' : diff === null ? '<span class="zero">—</span>' : diff === 0 ? '<span class="zero">동가</span>' : `<span class="${diff < 0 ? "neg" : "pos"}">${diff > 0 ? "+" : ""}${fmt(diff)}</span>`;
  return `<tr class="${r.pin ? "pin" : ""}">
    <td>${r.c}</td>
    <td>${r.n}</td>
    <td>${r.mno}</td><td>${r.net}</td><td>${r.data}</td><td>${r.qos}</td><td>${r.v}</td><td>${r.s}</td>
    <td>${fmt(r.reg)}</td>
    <td>${fmt(promoOf(r))}</td>
    <td>${diffCell}</td>
    <td>${r.per}</td>
    <td>${Math.round(r.reg / cat.gb).toLocaleString()}</td>
    <td>${Math.round(promoOf(r) / cat.gb).toLocaleString()}</td>
  </tr>`;
}
function renderTbody(catId) {
  const cat = CATS[catId];
  const pin = cat.rows.find(r => r.pin);
  let rows = sortRows(cat.rows, SORTS[catId] || "promo");
  const f = NETS[catId];
  if (f) {
    // 통신망 필터 시에도 비교 기준인 핀다이렉트 행은 항상 최상단 고정
    rows = rows.filter(r => r.pin || r.mno.split("\u00b7").includes(f));
    if (pin) rows = [pin, ...rows.filter(r => !r.pin)];
  }
  const el = document.getElementById("tb_" + catId);
  if (el) el.innerHTML = rows.map(r => rowHtml(r, cat, pin)).join("");
}
function setSort(catId, val) { SORTS[catId] = val; renderTbody(catId); }

function buildCatPage(id, cat) {
  const pin = cat.rows.find(r => r.pin);
  const saveOf = r => { const m = perMonths(r.per); return (r.promo != null && m) ? (r.reg - r.promo) * m : 0; };
  let kpis;
  if (!pin) {
    kpis = `<div class="pinmissing">이 카테고리에 <b>핀다이렉트 기준 상품</b>이 없습니다(단종·미게시). 아래 경쟁사 비교표·그래프는 정상 표시됩니다.</div>`;
  } else {
    const minPromoRow = [...cat.rows].sort((a, b) => promoOf(a) - promoOf(b))[0];
    const promoGap = promoOf(pin) - promoOf(minPromoRow);
    const pinMonths = perMonths(pin.per);
    const pinSave = pinMonths ? (pin.reg - promoOf(pin)) * pinMonths : 0;
    const maxSaveRow = [...cat.rows].sort((a, b) => saveOf(b) - saveOf(a))[0];
    const maxSave = saveOf(maxSaveRow);
    const saveGap = pinSave - maxSave; // 0 = 자사가 최대
    kpis = `
    <div class="kpisplit">
      <div class="kpicol">
        <div class="kpicol-h">프로모션가 · 가입 직후 월요금</div>
        <div class="kpitrio">
          <div class="kpi self"><div class="k">자사 프로모션가</div><div class="v">${fmt(promoOf(pin))}원</div><div class="s">${pin.per} · 종료 후 ${fmt(pin.reg)}원</div></div>
          <div class="kpi"><div class="k">카테고리 최저 프로모션가</div><div class="v">${fmt(promoOf(minPromoRow))}원</div><div class="s">${minPromoRow.pin || promoGap === 0 ? "핀다이렉트" : minPromoRow.c}</div></div>
          <div class="kpi"><div class="k">차이</div><div class="v">${promoGap === 0 ? '<span class="rank1">최저 동률</span>' : '<span class="neg">+' + fmt(promoGap) + '원</span>'}</div><div class="s">${promoGap === 0 ? "자사가 카테고리 최저" : "자사가 최저 대비 비쌈"}</div></div>
        </div>
      </div>
      <div class="kpicol">
        <div class="kpicol-h">혜택 총액 · (정가−프로모션가) × 기간</div>
        <div class="kpitrio">
          <div class="kpi self"><div class="k">자사 프로모션 혜택 총액</div><div class="v">${fmt(pinSave)}원</div><div class="s">(정가−프로모션가) × ${pin.per}</div></div>
          <div class="kpi"><div class="k">카테고리 최대 혜택 총액</div><div class="v">${fmt(maxSave)}원</div><div class="s">${maxSaveRow.pin ? "핀다이렉트" : maxSaveRow.c + " · " + maxSaveRow.per}</div></div>
          <div class="kpi"><div class="k">차이</div><div class="v">${saveGap === 0 ? '<span class="rank1">최대 동률</span>' : '<span class="neg">' + fmt(saveGap) + '원</span>'}</div><div class="s">${saveGap === 0 ? "자사가 카테고리 최대" : "자사가 최대 대비 적음"}</div></div>
        </div>
      </div>
    </div>`;
  }

  // promo bars (asc by promo; 상시형은 정가로 표기)
  // 가격대가 10원~수만원으로 넓어 선형 스케일이면 저가군이 전부 미세 stub이 된다 → 로그 스케일로 시각차 확보
  const promoRows = cat.rows.map(r => ({...r, p: r.promo != null ? r.promo : r.reg}))
    .sort((a, b) => a.p - b.p);
  const minP = Math.min(...promoRows.map(r => r.p));
  const maxP = Math.max(...promoRows.map(r => r.p));
  const lgP = x => Math.log(x + 1);
  const promoW = v => maxP === minP ? 100 : (8 + (lgP(v) - lgP(minP)) / (lgP(maxP) - lgP(minP)) * 92);
  const bars = promoRows.map(r => `
    <div class="barrow">
      <div class="barlabel">${r.c}</div>
      <div class="bartrack"><div class="barfill ${r.pin ? "pin" : ""}" style="width:${promoW(r.p).toFixed(1)}%"></div></div>
      <div class="barval">${fmt(r.p)}원 · ${r.per}${r.promo == null ? "" : " → 이후 " + fmt(r.reg) + "원"}</div>
    </div>`).join("");

  // 프로모션 혜택 총액 bars — (정가−프로모션가)×할인기간
  const saveRows = cat.rows.map(r => {
    const m = perMonths(r.per);
    return {...r, save: (r.promo != null && m) ? (r.reg - r.promo) * m : 0, m};
  }).sort((a, b) => b.save - a.save);
  const maxS = Math.max(...saveRows.map(r => r.save), 1);
  const saveBars = saveRows.map(r => `
    <div class="barrow">
      <div class="barlabel">${r.c}</div>
      <div class="bartrack"><div class="barfill ${r.pin ? "pin" : ""}" style="width:${Math.max(1, r.save / maxS * 100)}%"></div></div>
      <div class="barval">${r.save ? fmt(r.save) + "원 (월 " + fmt(r.reg - r.promo) + "원 × " + r.m + "개월)" : "프로모션 혜택 없음 (" + r.per + ")"}</div>
    </div>`).join("");

  return `
    <div class="card"><h2>${cat.title}</h2>
    <div class="cardhead">
      <div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select class="sortsel" onchange="setNet('${id}', this.value)">
          <option value="">통신망 전체</option>
          <option value="SKT">SKT</option>
          <option value="KT">KT</option>
          <option value="LGU+">LGU+</option>
        </select>
        <select class="sortsel" onchange="setSort('${id}', this.value)">
          <option value="promo">프로모션가 낮은 순</option>
          <option value="reg">정가 낮은 순</option>
          <option value="period">할인기간 긴 순</option>
          <option value="mno">통신망별</option>
        </select>
        <button class="btn" onclick="exportCsv('${id}')">CSV 내보내기</button>
      </div>
    </div>
    ${kpis}
    <div class="tblwrap"><table>
      <thead><tr><th>회사</th><th>요금제명</th><th>통신망</th><th>5G/LTE</th><th>데이터</th><th>QoS</th><th>통화</th><th>문자</th><th>정가(원)</th><th>프로모션가(원)</th><th>자사 대비(원)</th><th>할인기간</th><th>원/GB</th><th>프로모 원/GB</th></tr></thead>
      <tbody id="tb_${id}"></tbody></table></div>
    </div>

    <div class="card"><h2>프로모션 비교 대시보드</h2>
      <div class="split">
        <div>
          <div class="bartitle">가입 직후 월요금 <span class="unit">(원/월)</span></div>
          <div class="barsub">막대가 길수록 월요금이 높음 · <span class="tagpin">보라 = 핀다이렉트</span></div>
          <div class="bars">${bars}</div>
        </div>
        <div>
          <div class="bartitle">프로모션 혜택 총액 <span class="unit">(원)</span></div>
          <div class="barsub">(정가 − 프로모션가) × 할인기간 · 막대가 길수록 혜택이 큼</div>
          <div class="bars">${saveBars}</div>
        </div>
      </div>
    </div>

    <div class="card analysis"><h2>가격 경쟁력 분석</h2>${cat.analysis}</div>`;
}

function setHistPage(id){ histState.page = id; histState.sel = null; renderHistory(); }
function setHistSub(id){ histState.sub = id; histState.sel = null; renderHistory(); }
function setHistN(n){ histState.n = n; histState.from = null; histState.to = null; renderHistory(); }
function selectHist(c){ histState.sel = (histState.sel === c ? null : c); renderHistory(); }
function setHistRange(){
  const f = document.getElementById("histFrom"), t = document.getElementById("histTo");
  if (!f || !t) return;
  let from = f.value || null, to = t.value || null;
  if (from && to && from > to) { const tmp = from; from = to; to = tmp; }
  histState.from = from; histState.to = to; histState.n = -1;
  renderHistory();
}
function histDeltaCard(){
  if (typeof DELTA === "undefined" || !DELTA || !DELTA.summary) return "";
  const f = n => Number(n).toLocaleString();
  const ch = DELTA.changes || [], ad = DELTA.added || [], rm = DELTA.removed || [];
  const head = `<div class="card"><h2>주요 변동</h2><div class="histnote">${DELTA.summary||""}</div>`;
  if (!ch.length && !ad.length && !rm.length) return head + `</div>`;
  const up = d => `<span style="color:var(--red);font-weight:700">\u25B2${f(d)}원</span>`;
  const dn = d => `<span style="color:var(--blue);font-weight:700">\u25BC${f(d)}원</span>`;
  let rows = "";
  for (const r of ch) { const d = r.to - r.from;
    rows += `<tr><td>${r.label}</td><td>${r.c}</td><td>${r.plan||"—"}</td><td>${f(r.from)}원</td><td>${f(r.to)}원</td><td>${d>0?up(d):dn(-d)}</td></tr>`; }
  for (const r of ad) rows += `<tr><td>${r.label}</td><td>${r.c}</td><td>${r.plan||"—"}</td><td>—</td><td>${f(r.to)}원</td><td><span class="badge b-good">신규</span></td></tr>`;
  for (const r of rm) rows += `<tr><td>${r.label}</td><td>${r.c}</td><td>—</td><td>${f(r.from)}원</td><td>—</td><td><span class="badge b-low">중단</span></td></tr>`;
  return head + `<div class="tblwrap"><table>
    <thead><tr><th>티어</th><th>회사</th><th>요금제명</th><th>직전(${DELTA.prevDate||"—"})</th><th>이번(${DELTA.date||"—"})</th><th>변동</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function buildHistoryPage(){ return `<div id="histroot"></div>`; }
function renderHistory() {
  const root = document.getElementById("histroot"); if (!root) return;
  const total = (typeof HIST !== "undefined" ? HIST : []).length;
  const pInfo = HIST_PAGES.find(p => p.id === histState.page);
  const pbtns = HIST_PAGES.map(p => `<button class="histbtn${p.id===histState.page?' on':''}" onclick="setHistPage('${p.id}')">${p.label}</button>`).join("");
  const subctrl = histState.page === "moyo"
    ? `<div class="histgrp">${MOYO_SUBS.map(s => `<button class="histbtn${s.id===histState.sub?' on':''}" onclick="setHistSub('${s.id}')">${s.label}</button>`).join("")}</div>` : "";
  const nbtns = [[0,"전체"]].map(([x,lab]) => `<button class="histbtn${histState.n===x?' on':''}" onclick="setHistN(${x})">${lab}</button>`).join("");
  const _allH = (typeof HIST !== "undefined" ? HIST : []);
  const dmin = _allH.length ? _allH[0].date : "", dmax = _allH.length ? _allH[_allH.length-1].date : "";
  const fromV = histState.from || dmin, toV = histState.to || dmax, rangeOn = histState.n === -1;
  const rangeInner = `<input type="date" id="histFrom" class="histdate" min="${dmin}" max="${dmax}" value="${fromV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<span class="histtil">~</span>`
    + `<input type="date" id="histTo" class="histdate" min="${dmin}" max="${dmax}" value="${toV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<button class="histbtn${rangeOn?' on':''}" onclick="setHistRange()">적용</button>`;
  const oneRound = total <= 1
    ? `<div class="histnote">아직 <b>${total}회차</b>뿐이라 기준점만 표시됩니다. 업데이트가 쌓이면 회사별 추이선이 그려집니다.</div>` : "";
  const meta = histSeries();
  const restartNote = meta.restarted
    ? `<div class="histnote" style="color:var(--amber);font-weight:700;">⟲ 기준 요금제가 <b>${meta.restartFrom}</b> 회차에 변경되어, 그 시점부터 새로 표시합니다(이전 기준의 추이는 스펙이 달라 이어 붙이지 않습니다).</div>` : "";
  root.innerHTML = `${histDeltaCard()}<div class="card">
    <h2>가격 히스토리</h2>
    <div class="histctrls">
      <div class="histgrp">${pbtns}</div>
      ${subctrl}
      <div class="histgrp">${nbtns}<span class="histvsep"></span><span class="histtil" style="margin:0 6px 0 0;font-weight:700">기간 선택</span>${rangeInner}</div>
    </div>
    <div class="histnote">회사별 <b>${pInfo.metric}(원)</b> 추이 · 선이나 회사 버튼을 누르면 상세 데이터가 열립니다.</div>
    ${oneRound}
    ${restartNote}
    ${histChartSvg()}
    ${histLegend()}
    ${histDetail()}
  </div>`;
}

tabDefs.forEach((t, i) => {
  const tab = document.createElement("div");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.textContent = t.label;
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("pg_" + t.id).classList.add("active");
  };
  tabsEl.appendChild(tab);
  const pg = document.createElement("div");
  pg.className = "page" + (i === 0 ? " active" : "");
  pg.id = "pg_" + t.id;
  pg.innerHTML = t.id === "summary" ? buildSummaryPage() : t.id === "history" ? buildHistoryPage() : t.id === "cheapest" ? buildCheapPage() : t.id === "moyo" ? buildMoyoPage() : t.id === "gifts" ? buildGiftsPage() : buildCatPage(t.id, CATS[t.id]);
  pages.appendChild(pg);
});
Object.keys(CATS).forEach(renderTbody);
renderHistory();
</script>
</body>
</html>
